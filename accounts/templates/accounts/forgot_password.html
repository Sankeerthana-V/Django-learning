<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
</head>
<body>
<h2> Forgot Password</h2>

<form method="POST">
    {%csrf_token %}
    <label for="id_email">Email:</label>
    <input 
        type="email"
        id="id_email"
        name="email"
        required
        autocomplete="email"
    />
    {% if form.email.errors %}
        <p>{{form.email.errors }}</p>
    {% endif %}

    <br><br>
    <button type="submit">Send reset link</button>
</form>
</body>
</html>
