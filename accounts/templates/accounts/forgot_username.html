<!DOCTYPE html>
<html>
<head>
    <title>Forgot Username</title>
</head>
<body>
<h2> Forgot Username</h2>

<form method="POST">
    {%csrf_token %}
    <label>Email:</label>
    <input type="email" name="email" required>
    <button type="submit">Find Username</button>
</form>
{% if message %}
    <p>{{ message }}</p>
{% endif %}


</body>
</html>
